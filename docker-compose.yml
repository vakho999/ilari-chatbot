version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ilaria-backend
    ports:
      - "5000:5000"     
    env_file:
      - ./backend/.env    
    environment:
      - NODE_ENV=development
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - ai-service

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ilaria-ai-service
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env    

